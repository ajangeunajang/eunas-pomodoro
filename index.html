<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<title>Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2;
    --fg: #1a1a1a;
    --muted: #8a8780;
    --line: #dcd9d2;
    --panel: #ffffff;
    --accent: #e8452c;
    --rest: #a3c443; /* shine muscat */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --fg: #ecebe7;
      --muted: #7d7a74;
      --line: #2c2b29;
      --panel: #1e1e1c;
      --accent: #f0583f;
      --rest: #b6d35c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --fg: #ecebe7;
    --muted: #7d7a74;
    --line: #2c2b29;
    --panel: #1e1e1c;
    --accent: #f0583f;
    --rest: #b6d35c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    word-break: keep-all;
    overflow-wrap: break-word;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    transition: background .4s;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
  }
  button:focus-visible { outline: 1px dashed var(--muted); outline-offset: 4px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 72px 16px 24px;
  }

  /* back to the first screen */
  .back { position: absolute; top: 24px; left: clamp(16px, 4vw, 40px); z-index: 2; font-size: 13px; color: var(--muted); padding: 4px 0; transition: color .2s; }
  .back:hover { color: var(--fg); }
  .back { display: inline-flex; align-items: center; gap: 8px; }
  .back svg { width: 16px; height: 10px; transition: translate .2s; }
  .back:hover svg { translate: -3px 0; }

  [hidden] { display: none !important; }
  .stack { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 40px; }

  /* clock faces — shared by the picker and the timer */
  .face {
    --pad: clamp(16px, 6vw, 32px);
    position: relative;
    aspect-ratio: 1;
    background: var(--panel);
    border-radius: 28px;
    overflow: hidden;
  }
  .face svg { position: absolute; inset: var(--pad); width: calc(100% - 2 * var(--pad)); height: calc(100% - 2 * var(--pad)); overflow: visible; }
  .dial { width: min(80vw, 420px); cursor: pointer; }
  /* alarm-clock buzz — uses the standalone translate/rotate properties so it
     stacks on top of the hover tilt (transform) instead of fighting it */
  @keyframes buzz {
    0%, 100% { translate: 0; rotate: 0deg; }
    25% { translate: -3px 0; rotate: -2deg; }
    50% { translate: 3px 0; rotate: 2deg; }
    75% { translate: -2px 0; rotate: -1deg; }
  }
  .dial.buzz-short { animation: buzz .1s linear 3; }
  .dial.buzz-ring { animation: buzz .1s linear 10; }
  @media (prefers-reduced-motion: reduce) { .dial.buzz-short, .dial.buzz-ring { animation: none; } }
  .ticks line { stroke: color-mix(in srgb, var(--muted) 45%, var(--panel)); stroke-width: 1; }
  .ticks line.major { stroke: var(--muted); }
  .wedge { fill: var(--c); transition: fill .4s; }
  .hub { fill: var(--panel); stroke: var(--line); }

  /* picker */
  .picker { width: min(100%, 1120px); display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .picker h1 { display: flex; align-items: baseline; gap: 8px; color: var(--accent); font-size: clamp(28px, 8vw, 40px); font-weight: 500; line-height: 1.2; letter-spacing: -0.01em; }
  .picker .choices { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(16px, 3vw, 40px); }
  @media (max-width: 640px) {
    .picker .choices { grid-template-columns: 1fr; justify-items: center; gap: 36px; }
    .picker .choice { width: min(72vw, 300px); }
  }
  .picker .choice { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
  .picker .choice .face { margin-bottom: 8px; }
  .picker .choice small { font-size: 13px; color: var(--muted); }
  .picker .choice[data-mode="focus"] { --c: var(--accent); }
  .picker .choice[data-mode="short"], .picker .choice[data-mode="long"] { --c: var(--rest); }
  .picker .choice .face { width: 100%; --pad: 10%; border-radius: clamp(20px, 3vw, 28px); }
  .picker .choice:hover, .picker .choice:focus-visible { color: var(--fg); }
  .picker .choice span { border-bottom: 1px solid transparent; padding-bottom: 2px; transition: color .2s, border-color .2s; }
  .picker .choice:hover span { border-bottom-color: currentColor; }
  .picker .choice .face, .dial { transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); }
  @media (hover: hover) {
    .picker .choice:hover .face, .dial:not(.settled):hover { transform: rotate(3deg); }
  }
  body { --c: var(--accent); }
  body[data-mode="short"], body[data-mode="long"] { --c: var(--rest); }

  .time {
    font-size: clamp(48px, 12vw, 72px);
    font-weight: 300;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .status { font-size: 13px; color: var(--muted); margin-top: 12px; text-align: center; min-height: 1.4em; }
  .readout { display: flex; flex-direction: column; align-items: center; }

  /* sessions */
  .dots { display: flex; gap: 10px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--muted);
    transition: background .3s, border-color .3s;
  }
  .dots span.done { background: var(--accent); border-color: var(--accent); }

  /* controls */
  .controls { display: flex; align-items: center; gap: 28px; font-size: 13px; }
  .controls .ghost { color: var(--muted); }
  .controls .ghost:hover { color: var(--fg); }
  .controls .primary {
    border: 1px solid var(--fg);
    border-radius: 999px;
    padding: 10px 28px;
    min-width: 112px;
    transition: background .2s, color .2s;
  }
  .controls .primary:hover { background: var(--fg); color: var(--bg); }

  .hint { font-size: 12px; color: var(--muted); }
  @media (hover: none) { .hint { display: none; } }

  /* tasks */
  /* fixed-height block so checking off / adding tasks never moves the clock;
     the list starts at the top of it and scrolls once it fills up */
  .tasks {
    width: min(100%, 520px); height: 210px;
    display: flex; flex-direction: column; justify-content: flex-start;
    font-size: 17px; text-align: center; margin: 0 0 -8px;
  }
  .tasks ul {
    list-style: none; display: grid; justify-items: center; gap: 8px; margin-bottom: 10px;
    min-height: 0; overflow-y: auto; padding: 6px 28px; scrollbar-width: none;
  }
  .tasks ul::-webkit-scrollbar { display: none; }
  .tasks li { position: relative; display: flex; align-items: baseline; gap: 8px; max-width: 100%; }
  .tasks .bullet { color: var(--muted); flex: none; }
  .tasks li .text {
    padding: 2px 0;
    color: var(--muted);
    transition: color .2s, font-size .2s;
  }
  /* the current task is the headline above the dial */
  .tasks li.current { order: -1; margin-bottom: 10px; }
  .tasks li.current .text { color: var(--accent); font-size: clamp(28px, 8vw, 40px); font-weight: 500; line-height: 1.2; letter-spacing: -0.01em; }
  .tasks li.current .bullet { color: var(--accent); font-size: clamp(28px, 8vw, 40px); }
  /* on a break the task waits — dim it */
  body:not([data-mode="focus"]) .tasks li.current .text,
  body:not([data-mode="focus"]) .tasks li.current .bullet { color: var(--muted); }
  /* hover: tasks tilt like the clocks */
  .tasks li .text { display: inline-block; transition: color .2s, font-size .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1); }
  @media (hover: hover) {
    .tasks li .text:hover { transform: rotate(3deg); }
    .tasks li:not(.current):not(.done) .text:hover { color: var(--fg); }
  }
  .tasks li.done { order: 1; }
  .tasks li.done .text { text-decoration: line-through; color: var(--line); }
  .tasks li.done .bullet { color: var(--line); }
  .tasks li .del {
    position: absolute; left: 100%; margin-left: 8px;
    color: var(--muted); opacity: 0; font-size: 13px; padding: 0 2px;
    transition: opacity .2s;
  }
  .tasks li:hover .del, .tasks li .del:focus-visible { opacity: 1; }
  @media (hover: none) { .tasks li .del { opacity: .6; } }
  .tasks form { display: flex; justify-content: center; }
  .tasks input {
    width: 100%; max-width: 320px;
    font: inherit; font-size: 13px; color: var(--fg); text-align: center;
    background: none; border: none; outline: none;
    padding: 4px 0;
    border-bottom: 1px dotted transparent;
  }
  /* iOS zooms the page into inputs under 16px, so touch screens keep 16px */
  @media (pointer: coarse) { .tasks input { font-size: 16px; } }
  .tasks input::placeholder { color: var(--line); }
  .tasks input:focus { border-bottom-color: var(--line); }
  .tasks form .bullet { display: none; }

  /* settings */
  .settings-wrap { position: absolute; top: 16px; right: clamp(16px, 4vw, 40px); z-index: 20; }
  .settings-toggle {
    display: grid; place-items: center; width: 36px; height: 36px; margin-left: auto;
    color: var(--muted); transition: color .2s;
  }
  .settings-toggle svg { width: 22px; height: 22px; transition: transform .4s cubic-bezier(.34, 1.56, .64, 1); }
  .settings-toggle:hover, .settings-toggle[aria-expanded="true"] { color: var(--fg); }
  .settings-toggle:hover svg, .settings-toggle[aria-expanded="true"] svg { transform: rotate(60deg); }
  .settings {
    position: absolute; top: 44px; right: 0;
    width: min(320px, calc(100vw - 32px));
    display: grid;
    gap: 14px;
    font-size: 13px;
    padding: 20px;
    background: var(--panel);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .08);
  }
  .settings[hidden] { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .row .label { color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--muted);
    line-height: 1;
    transition: color .2s, border-color .2s;
  }
  .stepper button:hover { color: var(--fg); border-color: var(--fg); }
  .stepper button:disabled { opacity: .3; pointer-events: none; }
  .stepper output { min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
  .settings .actions { display: flex; justify-content: space-between; gap: 12px; padding-top: 4px; font-size: 12px; }
  .settings .actions button { color: var(--muted); }
  .settings .actions button:hover { color: var(--fg); }

  .tomato { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; will-change: transform; }
  .tomato svg { width: 100%; height: 100%; display: block; }
  .tomato svg > * { pointer-events: auto; cursor: pointer; }

  footer {
    padding: 24px 16px 32px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
  }
  footer .sym { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; padding-bottom: 1px; }
</style>
</head>
<body data-mode="focus" data-view="pick">
<main>
  <div class="settings-wrap" id="settingsWrap">
    <button class="settings-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settings" aria-label="settings" title="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M10.3 2.8h3.4l.5 2.4 1.6.9 2.3-.8 1.7 2.9-1.8 1.6v1.9l1.8 1.6-1.7 2.9-2.3-.8-1.6.9-.5 2.4h-3.4l-.5-2.4-1.6-.9-2.3.8-1.7-2.9 1.8-1.6v-1.9L4.2 8.2l1.7-2.9 2.3.8 1.6-.9z"/><circle cx="12" cy="12" r="3"/></g></svg>
    </button>

    <section class="settings" id="settings" hidden aria-label="settings">
      <div class="row" data-key="focus" data-min="1" data-max="60" data-unit="min">
        <span class="label">focus</span>
        <div class="stepper"><button data-d="-1" aria-label="decrease focus">−</button><output></output><button data-d="1" aria-label="increase focus">+</button></div>
      </div>
      <div class="row" data-key="short" data-min="1" data-max="30" data-unit="min">
        <span class="label">short break</span>
        <div class="stepper"><button data-d="-1" aria-label="decrease short break">−</button><output></output><button data-d="1" aria-label="increase short break">+</button></div>
      </div>
      <div class="row" data-key="long" data-min="1" data-max="60" data-unit="min">
        <span class="label">long break</span>
        <div class="stepper"><button data-d="-1" aria-label="decrease long break">−</button><output></output><button data-d="1" aria-label="increase long break">+</button></div>
      </div>
      <div class="row" data-key="cycle" data-min="2" data-max="8" data-unit="sessions">
        <span class="label">cycle</span>
        <div class="stepper"><button data-d="-1" aria-label="decrease sessions per cycle">−</button><output></output><button data-d="1" aria-label="increase sessions per cycle">+</button></div>
      </div>
      <div class="actions">
        <button id="defaults">restore defaults</button>
        <button id="clearTomatoes">clear tomatoes</button>
      </div>
    </section>
  </div>

  <section class="picker" id="picker" aria-label="choose a clock">
    <h1><span aria-hidden="true">*</span>choose a timer</h1>
    <div class="choices">
      <button class="choice" data-mode="focus"><div class="face"></div><span>focus</span><small></small></button>
      <button class="choice" data-mode="short"><div class="face"></div><span>short break</span><small></small></button>
      <button class="choice" data-mode="long"><div class="face"></div><span>long break</span><small></small></button>
    </div>
  </section>

  <div class="stack" id="timerView" hidden>
  <button class="back" id="backToPicker"><svg viewBox="0 0 16 10" aria-hidden="true"><path d="M15 5H1.5M5.5 1 1.5 5l4 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>all timers</button>

  <section class="tasks" aria-label="tasks">
    <ul id="taskList"></ul>
    <form id="taskForm" autocomplete="off">
      <span class="bullet" aria-hidden="true">*</span>
      <input id="taskInput" type="text" placeholder="add a task, press enter" aria-label="add a task" maxlength="80">
    </form>
  </section>

  <div class="face dial" id="dial" title="click to start / pause"></div>

  <div class="readout">
    <div class="time" id="time">25:00</div>
    <div class="status" id="status">ready</div>
  </div>

  <div class="dots" id="dots" aria-label="completed sessions"></div>

  <div class="controls">
    <button class="ghost" id="reset">reset</button>
    <button class="primary" id="toggle">start</button>
    <button class="ghost" id="skip">skip</button>
  </div>

  <p class="hint">space start/pause · r reset · s skip</p>
  </div>
</main>

<footer>
  <div><span class="sym">©</span> 2026. Pomodoro. All rights reserved.</div>
  <div>Inquiries <span class="sym">☞</span> ajangeunajang@gmail.com</div>
  <div>Design and Developed by <a href="https://www.ajangeunajang.com/" target="_blank" rel="noopener">Euna Jang</a></div>
</footer>

<script>
(() => {
  const DEFAULTS = { focus: 25, short: 5, long: 15, cycle: 4 };
  const STORE_KEY = "pomodoro-settings";
  const settings = { ...DEFAULTS };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    for (const k in DEFAULTS) if (Number.isFinite(saved[k])) settings[k] = saved[k];
  } catch (e) {}
  const DURATION = {};
  const syncDurations = () => {
    DURATION.focus = settings.focus * 60;
    DURATION.short = settings.short * 60;
    DURATION.long = settings.long * 60;
  };
  syncDurations();
  const LABEL = { focus: "focus", short: "short break", long: "long break" };
  const R = 92;

  const $ = (id) => document.getElementById(id);
  const timeEl = $("time"), statusEl = $("status"),
        toggleBtn = $("toggle"), dotsEl = $("dots");

  let mode = "focus";
  let remaining = DURATION.focus * 1000; // ms
  let endAt = null;                       // timestamp while running
  let completed = 0;                      // focus sessions in current cycle

  // ---- clock faces: each mounts into a .face and returns draw(msLeft, msTotal)
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs = {}) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const clamp01 = (x) => Math.min(1, Math.max(0, x));

  // a wedge on a round face; draw(frac) fills that fraction of the circle.
  // The picker scales to an hour (25 / 5 / 15 min read at a glance);
  // the timer scales to the session, so it starts as a full circle.
  function mountDial(face) {
      face.innerHTML = "";
      const svg = svgEl("svg", { viewBox: "-110 -110 220 220", "aria-hidden": "true" });
      const ticks = svgEl("g", { class: "ticks" });
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2, major = i % 5 === 0;
        const r1 = 100, r2 = major ? 108 : 104;
        ticks.appendChild(svgEl("line", {
          x1: Math.sin(a) * r1, y1: -Math.cos(a) * r1,
          x2: Math.sin(a) * r2, y2: -Math.cos(a) * r2,
          class: major ? "major" : "",
        }));
      }
      const wedge = svgEl("path", { class: "wedge" });
      svg.append(ticks, wedge, svgEl("circle", { class: "hub", r: 7 }));
      face.appendChild(svg);
      return (frac) => wedge.setAttribute("d", wedgePath(clamp01(frac)));
  }

  const drawMain = mountDial($("dial"));
  let wedgeTweening = false; // true while a slide is morphing the wedge

  // wedge = remaining time, shrinking back toward 12 o'clock (counter-clockwise face)
  function wedgePath(frac) {
    if (frac <= 0) return "";
    if (frac >= 0.99999) return `M0 ${-R} A${R} ${R} 0 1 0 0 ${R} A${R} ${R} 0 1 0 0 ${-R}Z`;
    const a = frac * Math.PI * 2;
    const x = -Math.sin(a) * R, y = -Math.cos(a) * R;
    const large = frac > 0.5 ? 1 : 0;
    return `M0 0 L0 ${-R} A${R} ${R} 0 ${large} 0 ${x} ${y}Z`;
  }

  const fmt = (ms) => {
    const s = Math.ceil(ms / 1000);
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  };

  function current() {
    return endAt ? Math.max(0, endAt - Date.now()) : remaining;
  }

  function renderDots() {
    dotsEl.innerHTML = "";
    for (let i = 0; i < settings.cycle; i++) {
      const s = document.createElement("span");
      if (i < completed) s.className = "done";
      dotsEl.appendChild(s);
    }
  }

  function render() {
    const ms = current();
    if (!wedgeTweening) drawMain(ms / (DURATION[mode] * 1000));
    const t = fmt(ms);
    timeEl.textContent = t;
    document.title = endAt ? `${t} · ${LABEL[mode]}` : "Pomodoro";
  }

  function setStatus() {
    if (endAt) statusEl.textContent = LABEL[mode];
    else if (remaining < DURATION[mode] * 1000) statusEl.textContent = "paused";
    else statusEl.textContent = "ready";
    toggleBtn.textContent = endAt ? "pause" : (remaining < DURATION[mode] * 1000 ? "resume" : "start");
  }

  function setMode(m, { autostart = false } = {}) {
    mode = m;
    endAt = null;
    remaining = DURATION[m] * 1000;
    document.body.dataset.mode = m;
    if (autostart) start();
    setStatus(); render();
  }

  function start() {
    if (endAt) return;
    endAt = Date.now() + remaining;
    unlockAudio();
    setStatus(); loop();
  }
  function pause() {
    if (!endAt) return;
    remaining = current();
    endAt = null;
    setStatus(); render();
  }
  // user-initiated start gets a short buzz; pause stays still
  const toggle = () => { if (endAt) pause(); else { start(); buzz("buzz-short"); } };
  function buzz(kind) {
    const d = $("dial");
    d.classList.remove("buzz-short", "buzz-ring");
    void d.offsetWidth; // restart the animation if it is already running
    d.classList.add(kind);
  }
  $("dial").addEventListener("animationend", (e) => e.currentTarget.classList.remove("buzz-short", "buzz-ring"));

  function reset() { setMode(mode); }

  function next(finished) {
    if (mode === "focus") {
      if (finished) completed++;
      const nextMode = completed >= settings.cycle ? "long" : "short";
      renderDots();
      setMode(nextMode, { autostart: finished });
    } else {
      if (mode === "long") completed = 0;
      renderDots();
      setMode("focus", { autostart: false });
    }
  }

  function finish() {
    chime();
    buzz("buzz-ring");
    if (Notification?.permission === "granted" && document.hidden) {
      new Notification(mode === "focus" ? "Focus done — take a break" : "Break over — back to focus");
    }
    next(true);
  }

  let raf = null;
  function loop() {
    cancelAnimationFrame(raf);
    const step = () => {
      if (!endAt) return;
      if (current() <= 0) { finish(); return; }
      render();
      raf = requestAnimationFrame(step);
    };
    step();
  }
  // rAF stops in background tabs — keep checking for completion
  setInterval(() => { if (endAt && current() <= 0) finish(); else if (endAt && document.hidden) render(); }, 500);

  // sound
  let ctx = null;
  function unlockAudio() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}
    if ("Notification" in window && Notification.permission === "default") {
      try { Notification.requestPermission(); } catch (e) {}
    }
  }
  function chime() {
    if (!ctx) return;
    [0, 0.18, 0.36].forEach((d, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = [880, 660, 880][i];
      const t = ctx.currentTime + d;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.65);
    });
  }

  // events
  toggleBtn.addEventListener("click", toggle);
  // clicking the dial straightens it: no hover tilt after the buzz until the pointer leaves
  $("dial").addEventListener("click", (e) => { e.currentTarget.classList.add("settled"); toggle(); });
  $("dial").addEventListener("mouseleave", (e) => e.currentTarget.classList.remove("settled"));
  $("reset").addEventListener("click", reset);
  $("skip").addEventListener("click", () => next(false));
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest("input, textarea, [contenteditable]")) return;
    if (document.body.dataset.view !== "timer") return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.key === "r") reset();
    else if (e.key === "s") next(false);
  });

  // settings panel
  const panel = $("settings"), panelToggle = $("settingsToggle");
  const rows = [...panel.querySelectorAll(".row")];

  function renderSettings() {
    rows.forEach((row) => {
      const k = row.dataset.key, v = settings[k];
      row.querySelector("output").textContent = `${v} ${row.dataset.unit}`;
      const [dec, inc] = row.querySelectorAll("button");
      dec.disabled = v <= +row.dataset.min;
      inc.disabled = v >= +row.dataset.max;
    });
  }

  function applySettings() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) {}
    // an untouched session picks up the new length right away;
    // a running or paused one keeps going and the change applies next time
    const idle = !endAt && remaining === DURATION[mode] * 1000;
    syncDurations();
    if (idle) remaining = DURATION[mode] * 1000;
    else if (!endAt) remaining = Math.min(remaining, DURATION[mode] * 1000);
    renderSettings(); renderDots(); setStatus(); render();
    if (document.body.dataset.view === "pick") renderPreviews();
  }

  rows.forEach((row) => {
    row.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      const k = row.dataset.key;
      const v = settings[k] + +b.dataset.d;
      settings[k] = Math.min(+row.dataset.max, Math.max(+row.dataset.min, v));
      applySettings();
    }));
  });

  function openPanel(open) {
    panel.hidden = !open;
    panelToggle.setAttribute("aria-expanded", String(open));
  }
  panelToggle.addEventListener("click", () => openPanel(panel.hidden));
  // close when clicking anywhere else or pressing Escape
  document.addEventListener("pointerdown", (e) => {
    if (!panel.hidden && !$("settingsWrap").contains(e.target)) openPanel(false);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) openPanel(false); });
  $("defaults").addEventListener("click", () => { Object.assign(settings, DEFAULTS); applySettings(); });

  // tasks — the first unfinished one is what this session is for
  const TASK_KEY = "pomodoro-tasks";
  let tasks = [];
  try {
    const saved = JSON.parse(localStorage.getItem(TASK_KEY) || "[]");
    if (Array.isArray(saved)) tasks = saved.filter((t) => t && typeof t.text === "string");
  } catch (e) {}
  const taskList = $("taskList"), taskInput = $("taskInput");

  function saveTasks() {
    try { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function renderTasks() {
    taskList.innerHTML = "";
    const cur = tasks.findIndex((t) => !t.done);
    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      if (t.done) li.classList.add("done");
      if (i === cur) li.classList.add("current");
      const bullet = document.createElement("span");
      bullet.className = "bullet"; bullet.textContent = "*"; bullet.setAttribute("aria-hidden", "true");
      const text = document.createElement("button");
      text.className = "text"; text.textContent = t.text;
      text.title = t.done ? "mark as not done" : "mark as done";
      text.addEventListener("click", () => {
        const r = text.getBoundingClientRect();
        const finishing = !t.done;
        t.done = !t.done; saveTasks(); renderTasks();
        if (finishing) dropTomato(r.left + r.width / 2, r.top + r.height / 2);
      });
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", `delete ${t.text}`);
      del.addEventListener("click", () => { tasks.splice(i, 1); saveTasks(); renderTasks(); });
      li.append(bullet, text, del);
      taskList.appendChild(li);
    });
  }

  $("taskForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = taskInput.value.replace(/^\s*[*\-•]\s*/, "").trim();
    if (!text) return;
    tasks.push({ text, done: false });
    taskInput.value = "";
    saveTasks(); renderTasks();
  });
  taskInput.addEventListener("keydown", (e) => { if (e.key === "Escape") taskInput.blur(); });

  // ---- picker: the first screen shows focus / short / long as three dials
  const pickerEl = $("picker"), timerView = $("timerView");
  const cardDraws = {};
  const previews = [...pickerEl.querySelectorAll(".choice")].map((btn) => {
    const m = btn.dataset.mode;
    const draw = mountDial(btn.querySelector(".face"));
    cardDraws[m] = draw;
    btn.addEventListener("click", () => {
      // measure the card untilted: the hover rotation inflates its bounding box
      const face = btn.querySelector(".face"), r = face.getBoundingClientRect();
      const w = face.offsetWidth;
      const from = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w, angle: btn.matches(":hover") ? 3 : 0, frac: hourFrac(m) };
      if (m !== mode || !endAt) setMode(m);
      showView("timer");
      if (canAnimate()) slideIn(from);
    });
    return () => {
      draw(hourFrac(m));
      btn.querySelector("small").textContent = `${settings[m]} min`;
    };
  });
  const renderPreviews = () => previews.forEach((p) => p());
  const hourFrac = (m) => (DURATION[m] * 1000) / 3600000;
  const sessionFrac = () => {
    const left = endAt ? Math.max(0, endAt - Date.now()) : remaining;
    return left / (DURATION[mode] * 1000);
  };

  // during a slide the wedge also morphs between the two scales
  function tweenWedge(draw, from, toFn, duration, done) {
    const t0 = performance.now();
    const ease = (x) => 1 - Math.pow(1 - x, 4);
    const frame = (now) => {
      const k = Math.min(1, (now - t0) / duration);
      draw(from + (toFn() - from) * ease(k));
      if (k < 1) requestAnimationFrame(frame); else done && done();
    };
    requestAnimationFrame(frame);
  }

  // desktop: the chosen dial glides from its card to the timer's spot (FLIP),
  // and the rest of the timer fades in around it
  const canAnimate = () =>
    matchMedia("(min-width: 641px)").matches &&
    !matchMedia("(prefers-reduced-motion: reduce)").matches &&
    typeof Element.prototype.animate === "function";

  function slideIn(from) {
    const dial = $("dial");
    const to = dial.getBoundingClientRect();
    const dx = from.cx - (to.left + to.width / 2);
    const dy = from.cy - (to.top + to.height / 2);
    const s = from.w / to.width;
    const ease = "cubic-bezier(.22, .9, .25, 1)";
    dial.style.zIndex = 1;
    // start from the tilted card and straighten out on the way in
    dial.animate(
      [{ transform: `translate(${dx}px, ${dy}px) scale(${s}) rotate(${from.angle}deg)` }, { transform: "none" }],
      { duration: 650, easing: ease }
    ).finished.then(() => { dial.style.zIndex = ""; }, () => {});
    wedgeTweening = true;
    drawMain(from.frac);
    tweenWedge(drawMain, from.frac, sessionFrac, 650, () => { wedgeTweening = false; render(); });
    [...timerView.children].forEach((el, i) => {
      if (el === dial) return;
      el.animate(
        [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
        { duration: 400, delay: 320 + i * 30, easing: ease, fill: "backwards" }
      );
    });
  }

  function showView(v) {
    document.body.dataset.view = v;
    pickerEl.hidden = v !== "pick";
    timerView.hidden = v !== "timer";
    if (v === "pick") renderPreviews();
    else render();
  }
  // the reverse: the timer dial glides back into its card, the other cards fade in
  $("backToPicker").addEventListener("click", () => {
    const dial = $("dial"), r = dial.getBoundingClientRect();
    const from = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, w: dial.offsetWidth, frac: sessionFrac() };
    showView("pick");
    if (canAnimate()) slideBack(from);
  });

  function slideBack(from) {
    const card = pickerEl.querySelector(`.choice[data-mode="${mode}"]`);
    const face = card.querySelector(".face");
    const to = face.getBoundingClientRect();
    const dx = from.cx - (to.left + to.width / 2);
    const dy = from.cy - (to.top + to.height / 2);
    const s = from.w / face.offsetWidth;
    const ease = "cubic-bezier(.22, .9, .25, 1)";
    card.style.position = "relative";
    card.style.zIndex = 1;
    face.animate(
      [{ transform: `translate(${dx}px, ${dy}px) scale(${s})` }, { transform: "none" }],
      { duration: 650, easing: ease }
    ).finished.then(() => { card.style.zIndex = ""; card.style.position = ""; }, () => {});
    tweenWedge(cardDraws[mode], from.frac, () => hourFrac(mode), 650);
    const others = [pickerEl.querySelector("h1"), ...card.querySelectorAll("span, small"),
      ...[...pickerEl.querySelectorAll(".choice")].filter((c) => c !== card)];
    others.forEach((el, i) => {
      el.animate(
        [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
        { duration: 400, delay: 320 + i * 40, easing: ease, fill: "backwards" }
      );
    });
  }

  // ---- a cherry tomato pops out of a finished task and piles up on the floor.
  // Every tomato is a little different, and clicking one kicks it back up.
  const TOMATO_REDS = ["#e8452c", "#e2402a", "#ec4f33", "#db3d26", "#e94a2f"];
  const rand = (a, b) => a + Math.random() * (b - a);

  // about 1 in 8 tomatoes comes out a little odd
  const ODD_KINDS = ["heart", "twin", "long", "flat", "nose", "bumpy"];
  function randomShape() {
    return {
      kind: Math.random() < 0.12 ? ODD_KINDS[Math.floor(Math.random() * ODD_KINDS.length)] : "round",
      size: Math.round(rand(38, 50)),
      sx: +rand(0.94, 1.08).toFixed(3),     // a bit wider or narrower
      sy: +rand(0.88, 1.0).toFixed(3),      // cherry tomatoes are slightly squat
      color: TOMATO_REDS[Math.floor(Math.random() * TOMATO_REDS.length)],
      leaves: Math.random() < 0.5 ? 5 : 6,
      leafRot: Math.round(rand(0, 72)),
      leafLen: +rand(3.8, 5).toFixed(2),
      stem: Math.random() < 0.5 ? 1 : -1,   // which way the stem curls
      phase: +rand(0, 6.28).toFixed(2),     // where the bumps fall on a bumpy one
    };
  }

  // body outline + where the leaves sit, in a 24×24 box centered on (12, 12)
  function tomatoBody(s) {
    const f = s.color;
    switch (s.kind) {
      case "heart":
        return { svg: `<path d="M12 7.2C9 1.6 1.2 4.2 3.4 12.6 4.8 17.6 9 20.8 12 21.6 15 20.8 19.2 17.6 20.6 12.6 22.8 4.2 15 1.6 12 7.2Z" fill="${f}"/>`, lx: 12, ly: 6.6 };
      case "twin":
        return { svg: `<circle cx="8.3" cy="13.6" r="6.8" fill="${f}"/><circle cx="15.4" cy="11.6" r="7.6" fill="${f}"/>`, lx: 15.4, ly: 6.9 };
      case "flat":
        return { svg: `<ellipse cx="12" cy="12" rx="11" ry="6.6" fill="${f}"/>`, lx: 12, ly: 8 };
      case "long":
        return { svg: `<ellipse cx="12" cy="12.6" rx="7.4" ry="10.4" fill="${f}"/>`, lx: 12, ly: 5.2 };
      case "nose":
        return { svg: `<ellipse cx="11.2" cy="12" rx="${(9 * s.sx).toFixed(2)}" ry="${(9 * s.sy).toFixed(2)}" fill="${f}"/><circle cx="19.6" cy="14.2" r="3.1" fill="${f}"/>`, lx: 11.2, ly: 12 - 9 * s.sy + 3.2 };
      case "bumpy": {
        const pts = [];
        for (let i = 0; i < 48; i++) {
          const a = (i / 48) * Math.PI * 2;
          const rr = 9.1 + 0.9 * Math.sin(5 * a + (s.phase || 0));
          pts.push(`${(12 + Math.cos(a) * rr).toFixed(2)},${(12 + Math.sin(a) * rr).toFixed(2)}`);
        }
        return { svg: `<polygon points="${pts.join(" ")}" fill="${f}" stroke="${f}" stroke-width=".8" stroke-linejoin="round"/>`, lx: 12, ly: 5.6 };
      }
      default: {
        const ry = 9.5 * s.sy;
        return { svg: `<ellipse cx="12" cy="12" rx="${(9.5 * s.sx).toFixed(2)}" ry="${ry.toFixed(2)}" fill="${f}"/>`, lx: 12, ly: 12 - ry + 3.2 };
      }
    }
  }

  // breaks pop a shine muscat grape instead: a plump pale-green oval with a short stem
  const GRAPE_GREENS = ["#b5d35a", "#a9cc4f", "#c1d96b", "#b0cf55", "#bcd662"];
  function randomGrape() {
    return {
      fruit: "grape",
      size: Math.round(rand(36, 46)),
      sx: +rand(0.9, 1.04).toFixed(3),
      sy: +rand(0.96, 1.08).toFixed(3),    // grapes run a little tall
      color: GRAPE_GREENS[Math.floor(Math.random() * GRAPE_GREENS.length)],
      stem: Math.random() < 0.5 ? 1 : -1,
    };
  }
  function grapeSVG(s) {
    const rx = 8 * s.sx, ry = 9.8 * s.sy, top = 12 - ry, k = s.stem;
    return `<svg viewBox="0 0 24 24" aria-hidden="true">
      <ellipse cx="12" cy="12" rx="${rx.toFixed(2)}" ry="${ry.toFixed(2)}" fill="${s.color}"/>
      <circle cx="12" cy="${(12 + ry - 1.3).toFixed(2)}" r=".7" fill="#7f9a32"/>
      <path d="M12 ${(top + 0.8).toFixed(2)} Q${12 + k * 0.4} ${(top - 1).toFixed(2)} ${12 + k * 1.4} ${(top - 1.8).toFixed(2)}" stroke="#7d6b35" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  function tomatoSVG(s) {
    if (s.fruit === "grape") return grapeSVG(s);
    const body = tomatoBody(s), cx = body.lx, cy = body.ly, pts = [];
    for (let i = 0; i < s.leaves * 2; i++) {
      const a = ((s.leafRot + (i * 180) / s.leaves) * Math.PI) / 180;
      const rr = i % 2 === 0 ? s.leafLen : 1.3;
      pts.push(`${(cx + Math.sin(a) * rr).toFixed(2)},${(cy - Math.cos(a) * rr * 0.62).toFixed(2)}`);
    }
    const sx = s.stem;
    return `<svg viewBox="0 0 24 24" aria-hidden="true">
      ${body.svg}
      <polygon points="${pts.join(" ")}" fill="#3d7a5c" stroke="#3d7a5c" stroke-width=".6" stroke-linejoin="round"/>
      <path d="M${cx} ${cy - 0.2} Q${cx + sx * 0.3} ${cy - 2.4} ${cx + sx * 1.8} ${cy - 3.2}" stroke="#3d7a5c" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  // tomatoes that have come to rest; new ones land on top and roll into the gaps
  const pile = [];
  const MAX_PILE = 80;
  const place = (t) => {
    t.el.style.transform = `translate(${t.cx - t.half}px, ${t.cy - t.half}px) rotate(${t.rot}deg)`;
  };

  function makeTomato(shape, cx, cy, rot = 0) {
    const el = document.createElement("div");
    el.className = "tomato";
    el.style.width = el.style.height = `${shape.size}px`;
    el.innerHTML = tomatoSVG(shape);
    document.body.appendChild(el);
    const t = {
      el, shape, cx, cy, rot, vx: 0, vy: 0, active: false,
      half: shape.size / 2,
      // collision radius ≈ the body (a flat one sits lower, so it gets a smaller circle)
      r: shape.size * (shape.kind === "flat" ? 0.29 : 0.39) * Math.max(shape.sx, shape.sy),
    };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); kick(t); });
    place(t);
    return t;
  }

  let lastH = window.innerHeight;
  window.addEventListener("resize", () => {
    const dh = window.innerHeight - lastH;
    lastH = window.innerHeight;
    pile.forEach((p) => {
      p.cy += dh;
      p.cx = Math.min(p.cx, window.innerWidth - p.r);
      place(p);
    });
    savePile();
  });

  // the pile survives reloads: positions are kept relative to the bottom edge
  const PILE_KEY = "pomodoro-tomatoes";
  function savePile() {
    const h = window.innerHeight;
    try {
      localStorage.setItem(PILE_KEY, JSON.stringify(pile.map((p) => ({
        x: Math.round(p.cx), b: Math.round(h - p.cy), rot: Math.round(p.rot), shape: p.shape,
      }))));
    } catch (e) {}
  }
  function restorePile() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(PILE_KEY) || "[]"); } catch (e) {}
    if (!Array.isArray(saved)) return;
    const h = window.innerHeight, w = window.innerWidth;
    saved.slice(-MAX_PILE).forEach((s) => {
      if (!Number.isFinite(s.x) || !Number.isFinite(s.b)) return;
      const shape = s.shape && Number.isFinite(s.shape.size) ? s.shape : randomShape();
      const t = makeTomato(shape, s.x, h - s.b, s.rot || 0);
      t.cx = Math.min(Math.max(t.cx, t.r), w - t.r);
      t.cy = Math.min(t.cy, h - t.r);
      place(t);
      pile.push(t);
    });
  }

  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  function dropTomato(x, y) {
    if (reduceMotion()) return;
    const t = makeTomato(mode === "focus" ? randomShape() : randomGrape(), x, y);
    t.vx = rand(-180, 180);   // px/s
    t.vy = rand(-680, -560);  // pops up first
    simulate(t);
  }

  // settings → "clear tomatoes": every tomato shrinks away and the saved pile is emptied
  function clearTomatoes() {
    pile.length = 0;
    savePile();
    [...document.querySelectorAll(".tomato")].forEach((el, i) => {
      el.dataset.gone = "1";
      el.style.pointerEvents = "none";
      el.animate([{ opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4 }],
        { duration: 280, delay: Math.min(i * 20, 400), easing: "ease-in", fill: "forwards" })
        .finished.then(() => el.remove(), () => el.remove());
    });
  }
  $("clearTomatoes").addEventListener("click", clearTomatoes);

  // clicking a tomato sends it flying again; anything resting on it drops too
  function kick(t) {
    if (reduceMotion()) return;
    const i = pile.indexOf(t);
    if (i !== -1) {
      pile.splice(i, 1);
      wakeAbove(t);
      savePile();
    }
    t.vx = rand(-220, 220);
    t.vy = rand(-900, -720);
    simulate(t);
  }
  function wakeAbove(t) {
    const above = pile.filter((p) => p.cy < t.cy - t.r * 0.5 && Math.hypot(p.cx - t.cx, p.cy - t.cy) < p.r + t.r + 3);
    above.forEach((p) => {
      pile.splice(pile.indexOf(p), 1);
      p.vx = 0; p.vy = 0;
      wakeAbove(p);
      simulate(p);
    });
  }

  function simulate(t) {
    if (t.active) return;
    t.active = true;
    const g = 2000;
    let last = performance.now(), still = 0;

    const step = (now) => {
      if (!t.el.isConnected || t.el.dataset.gone) return; // cleared mid-flight
      // rAF timestamps can precede performance.now() on the first frame
      const dt = Math.max(0, Math.min(0.032, (now - last) / 1000));
      last = now;
      const floor = window.innerHeight - t.r, right = window.innerWidth - t.r;

      t.vy += g * dt;
      t.cx += t.vx * dt; t.cy += t.vy * dt;
      let contact = false;

      if (t.cx < t.r) { t.cx = t.r; t.vx = -t.vx * 0.5; }
      if (t.cx > right) { t.cx = right; t.vx = -t.vx * 0.5; }
      if (t.cy >= floor && t.vy >= 0) {
        t.cy = floor; contact = true;
        t.vy = t.vy > 120 ? -t.vy * 0.4 : 0;
        t.vx *= Math.pow(0.05, dt);         // rolling friction on the floor
      }

      // bump against tomatoes already resting
      for (const p of pile) {
        let dx = t.cx - p.cx, dy = t.cy - p.cy;
        if (Math.abs(dx) < 0.5) dx = (Math.random() < 0.5 ? -1 : 1) * 0.5; // no towers
        const d = Math.hypot(dx, dy), min = t.r + p.r;
        if (d >= min || d === 0) continue;
        const nx = dx / d, ny = dy / d;
        t.cx += nx * (min - d); t.cy += ny * (min - d);
        const vn = t.vx * nx + t.vy * ny;
        if (vn < 0) { t.vx -= 1.3 * vn * nx; t.vy -= 1.3 * vn * ny; }
        t.vx *= Math.pow(0.3, dt);
        contact = true;
      }
      // collisions can shove it past a wall — keep it on screen
      t.cx = Math.min(Math.max(t.cx, t.r), right);
      t.cy = Math.min(t.cy, floor);

      t.rot += (t.vx * dt / t.r) * (180 / Math.PI);
      place(t);

      // settle once it has barely moved for a moment while touching something
      still = contact && Math.hypot(t.vx, t.vy) < 60 ? still + dt : 0;
      if (still > 0.25) {
        t.active = false;
        pile.push(t);
        if (pile.length > MAX_PILE) {
          const old = pile.shift();
          old.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" })
            .finished.then(() => old.el.remove(), () => old.el.remove());
        }
        savePile();
        return;
      }
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  restorePile();
  renderTasks();
  renderSettings(); renderDots(); setStatus(); render();
  showView("pick");
})();
</script>
</body>
</html>
